name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Go tests
        run: go test ./...
      - name: Browser logic tests
        run: node --test web/js/*.test.mjs scripts/*.test.mjs
      - name: Compile Windows desktop tests
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go test -c -o faceforge-bdo.test.exe ./cmd/faceforge-bdo
      - name: Build Windows standalone
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-H windowsgui -s -w -X main.buildVersion=ci" -o "FaceForge BDO CI.exe" ./cmd/faceforge-bdo

  windows-native-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - name: Test PowerShell publisher helpers
        shell: powershell
        run: ./scripts/test-publish-helpers.ps1
      - name: Exercise native WebView2 window
        env:
          FACEFORGE_BDO_DESKTOP_SMOKE: '1'
        run: go test ./cmd/faceforge-bdo -run TestNativeDesktopWindowStartsAndStops -count=1 -v
