name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Test PowerShell publisher helpers
        shell: powershell
        run: ./scripts/test-publish-helpers.ps1
      - name: Test native desktop window
        env:
          FACEFORGE_BDO_DESKTOP_SMOKE: '1'
        run: go test ./cmd/faceforge-bdo -run TestNativeDesktopWindowStartsAndStops -count=1 -v
      - name: Build and package release
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./package.ps1 -Version $version
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
