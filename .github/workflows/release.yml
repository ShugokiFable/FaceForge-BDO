name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Resolve release metadata
        id: release_meta
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.Trim()
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Release version is empty.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Test PowerShell publisher helpers
        shell: powershell
        run: ./scripts/test-publish-helpers.ps1
      - name: Test native desktop window
        env:
          FACEFORGE_BDO_DESKTOP_SMOKE: '1'
        run: go test ./cmd/faceforge-bdo -run TestNativeDesktopWindowStartsAndStops -count=1 -v
      - name: Build and package release
        shell: pwsh
        run: ./package.ps1 -Version '${{ steps.release_meta.outputs.version }}'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: '${{ steps.release_meta.outputs.tag }}'
          target_commitish: '${{ github.sha }}'
          name: 'FaceForge BDO ${{ steps.release_meta.outputs.version }}'
          files: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
